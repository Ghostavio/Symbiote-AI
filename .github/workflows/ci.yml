name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Report environment
        run: |
          uname -a
          python3 --version
          /bin/bash --version | head -n 1

      - name: Validate wrappers, links, and shell syntax
        run: python3 -B scripts/validate-kit.py

      - name: Run unit tests
        run: python3 -B -m unittest discover -s tests -v
